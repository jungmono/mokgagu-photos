name: seoul-photos
on:
  push:
    paths: ['seoul-list.json','tools/seoul_fetch.py','.github/workflows/seoul.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python tools/seoul_fetch.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A photos/seoul thumbs-seoul seoul-report.txt
          git commit -m "서울옥션 사진 저장(자동)" || echo none
          git pull --rebase -q; git push
